[package]
name = "teamy-cancellation"
version = "0.3.1"
edition = "2024"
authors = ["TeamDman"]
description = "Reusable cancellation primitives for Teamy Rust tools."
license = "MPL-2.0"
readme = "README.md"
repository = "https://github.com/TeamDman/teamy-cancellation"
keywords = ["cancellation", "ctrlc", "tracing", "cli"]
categories = ["asynchronous", "command-line-utilities"]
documentation = "https://github.com/TeamDman/teamy-cancellation"

# Keep this checkout independent when used inside an integration workspace.
[workspace]

[dependencies]
arbitrary = { version = "1.4.1", features = ["derive"], optional = true }
ctrlc = { version = "3.5.1", optional = true }
eyre = "0.6.12"
facet = { version = "=0.50.0-rc.7", optional = true }
figue = { version = "=5.0.0-rc.6", features = ["arbitrary"], optional = true }
humantime = { version = "2.3.0", optional = true }
tracing = { version = "0.1.41", optional = true }
tracing-subscriber = { version = "0.3.19", default-features = false, features = ["registry"], optional = true }

[features]
default = ["ctrlc", "tracing", "tracing-subscriber", "inheritance"]
arbitrary = ["dep:arbitrary"]
ctrlc = ["dep:ctrlc"]
tracing = ["dep:tracing"]
tracing-subscriber = ["tracing", "dep:tracing-subscriber"]
inheritance = []
facet = ["dep:facet"]
figue = ["facet", "tracing-subscriber", "dep:figue", "dep:humantime"]

[[example]]
name = "cancellation_token"
path = "examples/cancellation_token.rs"

[[example]]
name = "inheritance"
path = "examples/inheritance.rs"
required-features = ["inheritance"]

[[example]]
name = "stop_after"
path = "examples/stop_after.rs"
required-features = ["figue"]

[[example]]
name = "ctrlc"
path = "examples/ctrlc.rs"
required-features = ["ctrlc"]

[lints.rust]
ambiguous_negative_literals = "warn"
missing_debug_implementations = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"

[lints.clippy]
cargo = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
multiple_crate_versions = "allow"
module_inception = "allow"
allow_attributes = "deny"
as_pointer_underscore = "warn"
assertions_on_result_states = "warn"
clone_on_ref_ptr = "warn"
deref_by_slicing = "warn"
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
fn_to_numeric_cast_any = "warn"
if_then_some_else_none = "warn"
map_err_ignore = "warn"
redundant_type_annotations = "warn"
renamed_function_params = "warn"
semicolon_outside_block = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unneeded_field_pattern = "warn"
unused_result_ok = "warn"

# Current upstream plus reviewed PRs; see README.md for integration policy.
# These workspace-root overrides do not propagate to downstream consumers.
[patch.crates-io]
facet = { git = "https://github.com/TeamDman/facet.git", rev = "a6101f92fa88ada6dedd80899140577e554bd5d3" }
facet-core = { git = "https://github.com/TeamDman/facet.git", rev = "a6101f92fa88ada6dedd80899140577e554bd5d3" }
facet-default = { git = "https://github.com/TeamDman/facet.git", rev = "a6101f92fa88ada6dedd80899140577e554bd5d3" }
facet-error = { git = "https://github.com/TeamDman/facet.git", rev = "a6101f92fa88ada6dedd80899140577e554bd5d3" }
facet-macro-parse = { git = "https://github.com/TeamDman/facet.git", rev = "a6101f92fa88ada6dedd80899140577e554bd5d3" }
facet-macro-types = { git = "https://github.com/TeamDman/facet.git", rev = "a6101f92fa88ada6dedd80899140577e554bd5d3" }
facet-macros = { git = "https://github.com/TeamDman/facet.git", rev = "a6101f92fa88ada6dedd80899140577e554bd5d3" }
facet-macros-impl = { git = "https://github.com/TeamDman/facet.git", rev = "a6101f92fa88ada6dedd80899140577e554bd5d3" }
facet-path = { git = "https://github.com/TeamDman/facet.git", rev = "a6101f92fa88ada6dedd80899140577e554bd5d3" }
facet-pretty = { git = "https://github.com/TeamDman/facet.git", rev = "a6101f92fa88ada6dedd80899140577e554bd5d3" }
facet-reflect = { git = "https://github.com/TeamDman/facet.git", rev = "a6101f92fa88ada6dedd80899140577e554bd5d3" }
facet-solver = { git = "https://github.com/TeamDman/facet.git", rev = "a6101f92fa88ada6dedd80899140577e554bd5d3" }
figue = { git = "https://github.com/TeamDman/figue.git", rev = "1ebad28e18d3e778c4e82cb255b26f0e23d4fed7" }
figue-attrs = { git = "https://github.com/TeamDman/figue.git", rev = "1ebad28e18d3e778c4e82cb255b26f0e23d4fed7" }
